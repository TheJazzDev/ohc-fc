<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Work+Sans:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:700px; min-height:1000px; background: oklch(0.16 0.01 260); font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260); padding: 40px;">

  <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; letter-spacing:0.12em; color: oklch(0.87 0.22 125); text-transform:uppercase;">OHC FC — Design System</div>
  <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:32px; margin-top:6px;">Components</div>

  <div style="font-size:12px; letter-spacing:0.1em; color: oklch(0.6 0.02 260); text-transform:uppercase; margin-top:36px; margin-bottom:14px;">Buttons</div>
  <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
    <div style="background: oklch(0.87 0.22 125); color: oklch(0.16 0.01 260); font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.02em; padding:12px 22px; border-radius:6px;">Primary action</div>
    <div style="background: transparent; border:1.5px solid oklch(0.87 0.22 125 / 0.5); color: oklch(0.96 0.01 260); font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.02em; padding:11px 22px; border-radius:6px;">Secondary</div>
    <div style="background: oklch(0.24 0.015 260); color: oklch(0.65 0.02 260); font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.02em; padding:12px 22px; border-radius:6px;">Disabled</div>
  </div>

  <div style="font-size:12px; letter-spacing:0.1em; color: oklch(0.6 0.02 260); text-transform:uppercase; margin-top:36px; margin-bottom:14px;">Position badges</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <div style="background: oklch(0.24 0.015 260); border:1px solid oklch(0.87 0.22 125 / 0.4); color: oklch(0.87 0.22 125); font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.06em; padding:6px 14px; border-radius:20px;">GK</div>
    <div style="background: oklch(0.24 0.015 260); border:1px solid oklch(0.87 0.22 125 / 0.4); color: oklch(0.87 0.22 125); font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.06em; padding:6px 14px; border-radius:20px;">DF</div>
    <div style="background: oklch(0.24 0.015 260); border:1px solid oklch(0.87 0.22 125 / 0.4); color: oklch(0.87 0.22 125); font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.06em; padding:6px 14px; border-radius:20px;">MF</div>
    <div style="background: oklch(0.24 0.015 260); border:1px solid oklch(0.87 0.22 125 / 0.4); color: oklch(0.87 0.22 125); font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.06em; padding:6px 14px; border-radius:20px;">FW</div>
  </div>

  <div style="font-size:12px; letter-spacing:0.1em; color: oklch(0.6 0.02 260); text-transform:uppercase; margin-top:36px; margin-bottom:14px;">Filter pills (squad filter — active / inactive)</div>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <div style="background: oklch(0.96 0.01 260); color: oklch(0.16 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">All</div>
    <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">GK</div>
    <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">DF</div>
    <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">MF</div>
    <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">FW</div>
  </div>

  <div style="font-size:12px; letter-spacing:0.1em; color: oklch(0.6 0.02 260); text-transform:uppercase; margin-top:36px; margin-bottom:14px;">Input field</div>
  <div style="max-width:320px;">
    <div style="border:1px solid oklch(0.96 0.01 260 / 0.2); background: oklch(0.20 0.015 260); border-radius:8px; padding:11px 14px; font-size:14px; color: oklch(0.55 0.02 260);">Search players…</div>
  </div>
</div>
</x-dc>
</body>
</html>
