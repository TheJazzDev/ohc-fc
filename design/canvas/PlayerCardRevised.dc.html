<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .pcr-wrap:hover .pc-face { background: oklch(0.24 0.015 260); box-shadow: 0 8px 20px oklch(0.05 0.01 260 / 0.35); }
    .pcr-wrap:hover .pcr-hint { opacity: 1; transform: rotate(24deg); }
    .pc-face { transition: background-color 150ms, box-shadow 150ms; }
    .pcr-hint { transition: opacity 150ms, transform 250ms; }
  </style>
</helmet>
<div
  class="pcr-wrap"
  onClick="{{toggle}}"
  style="width:100%; height:{{cardHeight}}px; cursor:pointer; perspective:1200px; font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260);"
>
  <div style="position:relative; width:100%; height:100%; transition: transform 500ms cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d; transform: {{frontTransform}};">

    <div class="pc-face" style="position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; border-radius:18px; border:1px solid oklch(0.96 0.01 260 / 0.1); background: oklch(0.20 0.015 260); padding:22px 18px; text-align:center;">

      <sc-if value="{{showFlipHint}}" hint-placeholder-val="{{true}}">
        <svg class="pcr-hint" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.65 0.02 260)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; top:14px; right:14px; opacity:0.45;">
          <path d="M4 12a8 8 0 0 1 14.9-4H16"></path>
          <path d="M16 4v4h4"></path>
          <path d="M20 12a8 8 0 0 1-14.9 4H8"></path>
          <path d="M8 20v-4H4"></path>
        </svg>
      </sc-if>

      <div style="width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.02em; color: oklch(0.16 0.01 260); background: linear-gradient(150deg, oklch(0.87 0.22 125) 0%, oklch(0.36 0.1 150) 100%);">{{initials}}</div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
        <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; line-height:1.2; letter-spacing:0.01em;">{{playerName}}</div>
        <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:{{labelSize}}px; letter-spacing:0.09em; white-space:nowrap; color: oklch(0.75 0.02 260); text-transform:uppercase;">#{{number}} · {{position}}</div>
      </div>
    </div>

    <div style="position:absolute; inset:0; backface-visibility:hidden; transform:rotateY(180deg); display:flex; flex-direction:column; justify-content:space-between; gap:10px; overflow:hidden; border-radius:18px; border:1px solid oklch(0.87 0.22 125 / 0.35); background: oklch(0.24 0.015 260); padding:20px 18px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
        <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; line-height:1.2;">{{playerName}}</div>
        <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; color: oklch(0.87 0.22 125); transform: skewX(-7deg);">#{{number}}</div>
      </div>
      <p style="margin:0; flex:1; font-size:13px; line-height:1.55; color: oklch(0.96 0.01 260 / 0.85); overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;">{{bio}}</p>
      <div style="font-family:'Oswald',sans-serif; font-weight:500; font-size:11px; letter-spacing:0.12em; color: oklch(0.65 0.02 260); text-transform:uppercase;">Tap to flip back</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"playerName":{"editor":null,"default":"J. Adeyemi"},"number":{"editor":null,"default":9},"position":{"editor":null,"default":"ST"},"initials":{"editor":null,"default":"JA"},"bio":{"editor":null,"default":"Sharp in the box, quick off the mark. Came through the youth setup and made the step up to first team this season."},"cardHeight":{"editor":"range","default":260,"min":232,"max":300,"step":4,"unit":"px","section":"Tweak"},"labelSize":{"editor":"range","default":14,"min":12,"max":16,"step":1,"unit":"px","section":"Tweak"},"showFlipHint":{"editor":"boolean","default":true,"section":"Tweak"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { flipped: false };
  }
  renderVals() {
    return {
      playerName: this.props.playerName ?? 'J. Adeyemi',
      number: this.props.number ?? 9,
      position: this.props.position ?? 'ST',
      initials: this.props.initials ?? 'JA',
      bio: this.props.bio ?? 'Sharp in the box, quick off the mark. Came through the youth setup and made the step up to first team this season.',
      cardHeight: this.props.cardHeight ?? 260,
      labelSize: this.props.labelSize ?? 14,
      showFlipHint: this.props.showFlipHint ?? true,
      frontTransform: this.state.flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
      toggle: () => this.setState({ flipped: !this.state.flipped }),
    };
  }
}
</script>
</body>
</html>
