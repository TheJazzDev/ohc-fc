<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:834px; height:1194px; background: oklch(0.16 0.01 260); font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260); overflow:hidden; display:flex; flex-direction:column;">

  <dc-import name="Header" variant="wide" hint-size="834px,64px"></dc-import>

  <div style="padding: 32px 60px 40px 60px;">
    <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:34px;">Squad</div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <div style="background: oklch(0.96 0.01 260); color: oklch(0.16 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">All</div>
      <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">GK</div>
      <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">DF</div>
      <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">MF</div>
      <div style="background: transparent; border:1px solid oklch(0.96 0.01 260 / 0.2); color: oklch(0.85 0.01 260); font-size:13px; padding:8px 16px; border-radius:20px;">FW</div>
    </div>

    <div style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; margin-top:20px;">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="11">
        <dc-import name="PlayerCard" player-name="{{p.name}}" number="{{p.number}}" position="{{p.position}}" initials="{{p.initials}}" has-photo="{{p.hasPhoto}}" hint-size="224px,200px"></dc-import>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      players: [
        { name: 'T. Mensah', number: 1, position: 'GK', initials: 'TM', hasPhoto: false },
        { name: 'K. Coker', number: 2, position: 'DF', initials: 'KC', hasPhoto: false },
        { name: 'S. Nwosu', number: 3, position: 'DF', initials: 'SN', hasPhoto: false },
        { name: 'D. Osei', number: 4, position: 'DF', initials: 'DO', hasPhoto: false },
        { name: 'R. Bello', number: 5, position: 'DF', initials: 'RB', hasPhoto: false },
        { name: 'M. Yusuf', number: 6, position: 'MF', initials: 'MY', hasPhoto: false },
        { name: 'F. Diallo', number: 7, position: 'FW', initials: 'FD', hasPhoto: false },
        { name: 'A. Balogun', number: 8, position: 'MF', initials: 'AB', hasPhoto: false },
        { name: 'J. Adeyemi', number: 9, position: 'FW', initials: 'JA', hasPhoto: true },
        { name: 'E. Chukwu', number: 10, position: 'MF', initials: 'EC', hasPhoto: false },
        { name: 'O. Bassey', number: 11, position: 'FW', initials: 'OB', hasPhoto: false },
      ],
    };
  }
}
</script>
</body>
</html>
