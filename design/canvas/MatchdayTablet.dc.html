<div style="width:834px; height:1194px; background: oklch(0.16 0.01 260); font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260); overflow:hidden; display:flex; flex-direction:column;">

  <div style="padding: 32px 60px 0 60px; flex-grow:1; display:flex; flex-direction:column; align-items:center;">

        <div style="background: oklch(0.87 0.22 125); color: oklch(0.16 0.01 260); font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; padding:6px 14px; border-radius:20px;">STARTING XI</div>

      </div>

      <div style="margin-top:24px; height:600px;">
        <dc-import name="PitchView" hint-size="660px,600px"></dc-import>
      </div>

      <div style="margin-top:28px;">
        <dc-import name="BenchStrip" direction="row" hint-size="660px,112px"></dc-import>
      </div>
    </div>
  </div>
</div>
