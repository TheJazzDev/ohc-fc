<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:390px; height:900px; background: oklch(0.16 0.01 260); font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260); overflow:hidden; display:flex; flex-direction:column;">

  <dc-import name="Header" variant="mobile" hint-size="390px,58px"></dc-import>

  <div style="padding: 20px 20px 0 20px; flex-grow:1; display:flex; flex-direction:column;">
    <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:26px;">vs Thornbridge Athletic</div>
    <div style="font-size:12px; color: oklch(0.65 0.02 260); margin-top:2px;">Saturday 14 September · 3:00PM · League Cup</div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <div style="background: oklch(0.87 0.22 125); color: oklch(0.16 0.01 260); font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.06em; padding:5px 12px; border-radius:20px;">STARTING XI</div>
      <div style="border:1px solid oklch(0.96 0.01 260 / 0.25); color: oklch(0.85 0.01 260); font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.06em; padding:5px 12px; border-radius:20px;">4-3-3</div>
    </div>

    <div style="margin-top:18px; height:440px;">
      <dc-import name="PitchView" hint-size="350px,440px"></dc-import>
    </div>

    <div style="margin-top:20px;">
      <dc-import name="BenchStrip" direction="row" hint-size="350px,112px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
