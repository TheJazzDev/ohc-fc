<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(1); }
      50% { opacity: 0.85; transform: translate(-50%,-50%) scale(1.08); }
    }
    @keyframes spin-seams {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</helmet>
<div style="width:100%; height:100%; min-height:200px; background: oklch(0.16 0.01 260); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
  <div style="position:absolute; top:50%; left:50%; width:{{glowSize}}px; height:{{glowSize}}px; border-radius:50%; background: radial-gradient(circle, oklch(0.87 0.22 125 / 0.4), transparent 70%); animation: glow-pulse 3.5s ease-in-out infinite;"></div>

  <div style="position:relative; animation: bob 4s ease-in-out infinite;">
    <svg width="{{size}}" height="{{size}}" viewBox="0 0 200 200" style="filter: drop-shadow(0 20px 30px oklch(0 0 0 / 0.5));">
      <defs>
        <radialGradient id="ballBody" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="oklch(0.3 0.02 260)"></stop>
          <stop offset="60%" stop-color="oklch(0.2 0.015 260)"></stop>
          <stop offset="100%" stop-color="oklch(0.12 0.01 260)"></stop>
        </radialGradient>
        <radialGradient id="sheen" cx="32%" cy="26%" r="40%">
          <stop offset="0%" stop-color="oklch(0.96 0.01 260 / 0.35)"></stop>
          <stop offset="100%" stop-color="transparent"></stop>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="88" fill="url(#ballBody)" stroke="oklch(0.87 0.22 125)" stroke-width="2"></circle>
      <g style="transform-origin: 100px 100px; animation: spin-seams 14s linear infinite;">
        <path d="M100 34 L128 56 L118 92 L82 92 L72 56 Z" fill="none" stroke="oklch(0.87 0.22 125)" stroke-width="2"></path>
        <path d="M100 34 L72 56 M100 34 L128 56 M72 56 L46 76 M128 56 L154 76 M82 92 L60 130 M118 92 L140 130 M46 76 L38 110 M154 76 L162 110 M60 130 L38 110 M140 130 L162 110" stroke="oklch(0.87 0.22 125 / 0.55)" stroke-width="1.5" fill="none"></path>
      </g>
      <circle cx="100" cy="100" r="88" fill="url(#sheen)"></circle>
    </svg>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"size":{"editor":"range","default":160,"min":100,"max":320,"step":10,"unit":"px","section":"Size"},"glowSize":{"editor":"range","default":280,"min":160,"max":480,"step":20,"unit":"px","section":"Size"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      size: this.props.size ?? 160,
      glowSize: this.props.glowSize ?? 280,
    };
  }
}
</script>
</body>
</html>
