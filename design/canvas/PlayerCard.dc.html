<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .pc-face { transition: background-color 150ms, box-shadow 150ms; }
    .pc-face:hover { background: oklch(0.24 0.015 260); box-shadow: 0 8px 20px oklch(0.05 0.01 260 / 0.35); }
  </style>
</helmet>
<div
  onClick="{{toggle}}"
  style="width:100%; height:232px; cursor:pointer; perspective:1200px; font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260);"
>
  <div style="position:relative; width:100%; height:100%; transition: transform 500ms cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d; transform: {{frontTransform}};">

    <div class="pc-face" style="position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; border-radius:16px; border:1px solid oklch(0.96 0.01 260 / 0.1); background: oklch(0.20 0.015 260); padding:20px 16px; text-align:center;">
      <div style="width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; letter-spacing:0.02em; color: oklch(0.16 0.01 260); background: linear-gradient(150deg, oklch(0.87 0.22 125) 0%, oklch(0.36 0.1 150) 100%);">{{initials}}</div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; line-height:1.2; letter-spacing:0.01em;">{{playerName}}</div>
        <div style="font-family:'Oswald',sans-serif; font-weight:500; font-size:12px; letter-spacing:0.1em; white-space:nowrap; color: oklch(0.65 0.02 260); text-transform:uppercase;">#{{number}} · {{position}}</div>
      </div>
    </div>

    <div style="position:absolute; inset:0; backface-visibility:hidden; transform:rotateY(180deg); display:flex; flex-direction:column; justify-content:space-between; gap:10px; overflow:hidden; border-radius:16px; border:1px solid oklch(0.87 0.22 125 / 0.35); background: oklch(0.24 0.015 260); padding:18px 16px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
        <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; line-height:1.2;">{{playerName}}</div>
        <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color: oklch(0.87 0.22 125); transform: skewX(-7deg);">#{{number}}</div>
      </div>
      <p style="margin:0; flex:1; font-size:13px; line-height:1.5; color: oklch(0.96 0.01 260 / 0.85); overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;">{{bio}}</p>
      <div style="font-family:'Oswald',sans-serif; font-weight:500; font-size:11px; letter-spacing:0.12em; color: oklch(0.65 0.02 260); text-transform:uppercase;">Tap to flip back</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"playerName":{"editor":null,"default":"J. Adeyemi"},"number":{"editor":null,"default":9},"position":{"editor":null,"default":"ST"},"initials":{"editor":null,"default":"JA"},"bio":{"editor":null,"default":"Sharp in the box, quick off the mark. Came through the youth setup and made the step up to first team this season."}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { flipped: false };
  }
  renderVals() {
    return {
      playerName: this.props.playerName ?? 'J. Adeyemi',
      number: this.props.number ?? 9,
      position: this.props.position ?? 'ST',
      initials: this.props.initials ?? 'JA',
      bio: this.props.bio ?? 'Sharp in the box, quick off the mark. Came through the youth setup and made the step up to first team this season.',
      frontTransform: this.state.flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
      toggle: () => this.setState({ flipped: !this.state.flipped }),
    };
  }
}
</script>
</body>
</html>
