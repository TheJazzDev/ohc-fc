<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Work+Sans:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:100%; height:100%; min-height:170px; background: oklch(0.20 0.015 260); border:1px solid oklch(0.96 0.01 260 / 0.1); border-radius:14px; padding:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-family:'Work Sans', system-ui, sans-serif; color: oklch(0.96 0.01 260); text-align:center;">

  <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{false}}">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="27" fill="oklch(0.28 0.02 260)" stroke="oklch(0.87 0.22 125)" stroke-width="1.5"></circle>
      <circle cx="28" cy="22" r="9" fill="oklch(0.4 0.02 260)"></circle>
      <path d="M10 50 C10 38 46 38 46 50" fill="oklch(0.4 0.02 260)"></path>
    </svg>
  </sc-if>
  <sc-if value="{{noPhoto}}" hint-placeholder-val="{{true}}">
    <div style="width:56px; height:56px; border-radius:50%; background: linear-gradient(135deg, oklch(0.87 0.22 125), oklch(0.5 0.15 150)); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color: oklch(0.16 0.01 260);">{{initials}}</div>
  </sc-if>

  <div style="font-weight:500; font-size:14px;">{{playerName}}</div>
  <div style="font-size:11px; color: oklch(0.6 0.02 260); font-family:'Oswald',sans-serif; letter-spacing:0.05em;">#{{number}} · {{position}}</div>
</div>
</x-dc>
<script data-dc-script data-props='{"hasPhoto":{"editor":"boolean","default":false,"section":"State"},"playerName":{"editor":null,"default":"J. Adeyemi"},"number":{"editor":null,"default":9},"position":{"editor":null,"default":"FWD"},"initials":{"editor":null,"default":"JA"}}'>
class Component extends DCLogic {
  renderVals() {
    const hasPhoto = this.props.hasPhoto ?? false;
    return {
      hasPhoto,
      noPhoto: !hasPhoto,
      playerName: this.props.playerName ?? 'J. Adeyemi',
      number: this.props.number ?? 9,
      position: this.props.position ?? 'FWD',
      initials: this.props.initials ?? 'JA',
    };
  }
}
</script>
</body>
</html>
