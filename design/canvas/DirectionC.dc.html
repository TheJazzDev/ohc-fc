<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: oklch(0.78 0.15 195); }
    a:hover { color: oklch(0.82 0.15 195); }
    @keyframes drift {
      0%, 100% { transform: translate(-50%,-50%) rotate(0deg); }
      50% { transform: translate(-50%,-50%) rotate(8deg); }
    }
  </style>
</helmet>
<div style="width:390px; height:900px; background: linear-gradient(160deg, oklch(0.14 0.03 250), oklch(0.17 0.04 280) 60%, oklch(0.15 0.03 250)); font-family: 'Space Grotesk', system-ui, sans-serif; color: oklch(0.95 0.01 250); overflow: hidden; position: relative; display: flex; flex-direction: column;">

  <div style="position:absolute; width:340px; height:340px; border-radius:50%; background: radial-gradient(circle, oklch(0.65 0.2 300 / 0.28), transparent 70%); top:-60px; left:-60px; filter: blur(2px);"></div>
  <div style="position:absolute; width:260px; height:260px; border-radius:50%; background: radial-gradient(circle, oklch(0.78 0.15 195 / 0.25), transparent 70%); bottom:120px; right:-80px;"></div>

  <div style="display:flex; align-items:center; justify-content:space-between; padding: 20px 22px 0 22px; position:relative;">
    <div style="font-weight:700; font-size:19px; letter-spacing:-0.01em;">OHC<span style="color:oklch(0.78 0.15 195)">·</span>FC</div>
    <div style="font-family:'Space Mono',monospace; font-size:10px; color: oklch(0.7 0.02 250); border:1px solid oklch(0.95 0.01 250 / 0.2); border-radius:20px; padding:4px 10px;">MENU</div>
  </div>

  <div style="position:relative; flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 0 24px;">
    <svg width="160" height="160" viewBox="0 0 160 160" style="position:relative; animation: drift 6s ease-in-out infinite;">
      <defs>
        <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="oklch(0.78 0.15 195)"></stop>
          <stop offset="100%" stop-color="oklch(0.65 0.2 300)"></stop>
        </linearGradient>
      </defs>
      <circle cx="80" cy="80" r="66" fill="none" stroke="url(#orb)" stroke-width="1.5"></circle>
      <circle cx="80" cy="80" r="50" fill="oklch(0.95 0.01 250 / 0.04)" stroke="url(#orb)" stroke-width="1"></circle>
      <ellipse cx="80" cy="80" rx="66" ry="20" fill="none" stroke="url(#orb)" stroke-width="1" opacity="0.6"></ellipse>
      <ellipse cx="80" cy="80" rx="20" ry="66" fill="none" stroke="url(#orb)" stroke-width="1" opacity="0.6"></ellipse>
    </svg>

    <div style="text-align:center; margin-top:22px;">
      <div style="font-weight:700; font-size:36px; line-height:1.02; letter-spacing:-0.02em;">Home of<br>the badge</div>
      <div style="margin-top:10px; font-family:'Space Mono',monospace; font-size:11px; color: oklch(0.78 0.15 195); letter-spacing:0.08em;">SEASON 25/26 · NON-LEAGUE</div>
    </div>
  </div>

  <div style="padding: 0 20px 18px 20px; display:flex; flex-direction:column; gap:12px; position:relative;">
    <div style="background: oklch(0.95 0.01 250 / 0.06); backdrop-filter: blur(12px); border:1px solid oklch(0.95 0.01 250 / 0.12); border-radius:16px; padding:16px 18px;">
      <div style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.1em; color: oklch(0.78 0.15 195);">NEXT_MATCH</div>
      <div style="font-weight:700; font-size:18px; margin-top:6px;">vs Thornbridge Athletic</div>
      <div style="font-family:'Space Mono',monospace; font-size:11px; color: oklch(0.75 0.02 250); margin-top:4px;">SAT 14.09 · 15:00 · LEAGUE CUP</div>
    </div>

    <div style="background: oklch(0.95 0.01 250 / 0.06); backdrop-filter: blur(12px); border:1px solid oklch(0.95 0.01 250 / 0.12); border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:12px;">
      <div style="width:44px; height:44px; border-radius:12px; background: linear-gradient(135deg, oklch(0.78 0.15 195), oklch(0.65 0.2 300)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color: oklch(0.14 0.03 250); flex-shrink:0;">JA</div>
      <div>
        <div style="font-weight:500; font-size:14px;">J. Adeyemi</div>
        <div style="font-family:'Space Mono',monospace; font-size:10px; color: oklch(0.7 0.02 250); letter-spacing:0.04em; margin-top:2px;">#9 · FWD</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
